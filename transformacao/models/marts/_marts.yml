version: 2

models:
  - name: fct_coletas
    description: Cada coleta de preço, com o desvio em relação à média do município na semana.
    columns:
      - name: desvio_media_municipio
        description: "Ex.: -0,03 = 3% abaixo da média do município, produto e semana."
        tests:
          - not_null
          - entre:
              arguments: {minimo: -0.6, maximo: 0.6}
              config:
                severity: warn
                # Coletas marcadas ficam fora das médias. O aviso só acende se forem muitas,
                # o que indicaria um problema no arquivo, não um posto isolado.
                warn_if: ">50"
      - name: desvio_mediana_uf
        description: Desvio em relação à mediana do estado, produto e semana; base da marcação abaixo.
      - name: fora_da_curva
        description: Preço provavelmente errado na origem (longe da mediana do estado e do município); fica fora das médias.
        tests:
          - not_null

  - name: preco_semanal_uf
    description: Preço médio, mediano, mínimo e máximo por semana, estado e produto.
    columns:
      - name: preco_medio
        tests:
          - not_null
          - entre:
              arguments: {minimo: 0.5, maximo: 20}
      - name: postos
        tests:
          - entre:
              arguments: {minimo: 1, maximo: 100000}

  - name: variacao_uf
    description: Variação do preço por estado e produto, média das 4 primeiras contra as 4 últimas semanas.
    columns:
      - name: variacao
        tests:
          - not_null
          - entre:
              arguments: {minimo: -0.8, maximo: 2}
              config: {severity: warn}

  - name: bandeiras
    description: Diferença média de preço de cada bandeira em relação aos concorrentes do mesmo município.

unit_tests:
  # Testam a regra de `fora_da_curva` com linhas fixas, sem depender de nenhum arquivo.
  # Estado com 6 postos a R$ 4,00 em outras cidades, mais o caso de cada teste.
  - name: posto_isolado_com_preco_de_gasolina_e_marcado
    model: fct_coletas
    given:
      - input: ref('stg_precos')
        rows:
          - {uf: PA, municipio: BELEM, produto: ETANOL, semana: 2024-01-29, cnpj: "1", preco_venda: 4.00}
          - {uf: PA, municipio: BELEM, produto: ETANOL, semana: 2024-01-29, cnpj: "2", preco_venda: 4.00}
          - {uf: PA, municipio: BELEM, produto: ETANOL, semana: 2024-01-29, cnpj: "3", preco_venda: 4.00}
          - {uf: PA, municipio: BELEM, produto: ETANOL, semana: 2024-01-29, cnpj: "4", preco_venda: 4.00}
          - {uf: PA, municipio: BELEM, produto: ETANOL, semana: 2024-01-29, cnpj: "5", preco_venda: 4.00}
          - {uf: PA, municipio: BELEM, produto: ETANOL, semana: 2024-01-29, cnpj: "6", preco_venda: 4.00}
          - {uf: PA, municipio: BELEM, produto: ETANOL, semana: 2024-01-29, cnpj: "7", preco_venda: 6.60}
    expect:
      rows:
        - {cnpj: "1", fora_da_curva: false}
        - {cnpj: "2", fora_da_curva: false}
        - {cnpj: "3", fora_da_curva: false}
        - {cnpj: "4", fora_da_curva: false}
        - {cnpj: "5", fora_da_curva: false}
        - {cnpj: "6", fora_da_curva: false}
        - {cnpj: "7", fora_da_curva: true}

  - name: cidade_cara_com_postos_concordando_nao_e_marcada
    model: fct_coletas
    given:
      - input: ref('stg_precos')
        rows:
          - {uf: PA, municipio: BELEM, produto: ETANOL, semana: 2024-01-29, cnpj: "1", preco_venda: 4.00}
          - {uf: PA, municipio: BELEM, produto: ETANOL, semana: 2024-01-29, cnpj: "2", preco_venda: 4.00}
          - {uf: PA, municipio: BELEM, produto: ETANOL, semana: 2024-01-29, cnpj: "3", preco_venda: 4.00}
          - {uf: PA, municipio: BELEM, produto: ETANOL, semana: 2024-01-29, cnpj: "4", preco_venda: 4.00}
          - {uf: PA, municipio: BELEM, produto: ETANOL, semana: 2024-01-29, cnpj: "5", preco_venda: 4.00}
          - {uf: PA, municipio: BELEM, produto: ETANOL, semana: 2024-01-29, cnpj: "6", preco_venda: 4.00}
          - {uf: PA, municipio: SANTAREM, produto: ETANOL, semana: 2024-01-29, cnpj: "7", preco_venda: 6.60}
          - {uf: PA, municipio: SANTAREM, produto: ETANOL, semana: 2024-01-29, cnpj: "8", preco_venda: 6.60}
          - {uf: PA, municipio: SANTAREM, produto: ETANOL, semana: 2024-01-29, cnpj: "9", preco_venda: 6.60}
    expect:
      rows:
        - {cnpj: "1", fora_da_curva: false}
        - {cnpj: "2", fora_da_curva: false}
        - {cnpj: "3", fora_da_curva: false}
        - {cnpj: "4", fora_da_curva: false}
        - {cnpj: "5", fora_da_curva: false}
        - {cnpj: "6", fora_da_curva: false}
        - {cnpj: "7", fora_da_curva: false}
        - {cnpj: "8", fora_da_curva: false}
        - {cnpj: "9", fora_da_curva: false}

  - name: cidade_com_dois_postos_usa_so_o_criterio_do_estado
    model: fct_coletas
    given:
      - input: ref('stg_precos')
        rows:
          - {uf: PA, municipio: BELEM, produto: ETANOL, semana: 2024-01-29, cnpj: "1", preco_venda: 4.00}
          - {uf: PA, municipio: BELEM, produto: ETANOL, semana: 2024-01-29, cnpj: "2", preco_venda: 4.00}
          - {uf: PA, municipio: BELEM, produto: ETANOL, semana: 2024-01-29, cnpj: "3", preco_venda: 4.00}
          - {uf: PA, municipio: BELEM, produto: ETANOL, semana: 2024-01-29, cnpj: "4", preco_venda: 4.00}
          - {uf: PA, municipio: BELEM, produto: ETANOL, semana: 2024-01-29, cnpj: "5", preco_venda: 4.00}
          - {uf: PA, municipio: BELEM, produto: ETANOL, semana: 2024-01-29, cnpj: "6", preco_venda: 4.00}
          - {uf: PA, municipio: ORIXIMINA, produto: ETANOL, semana: 2024-01-29, cnpj: "7", preco_venda: 4.10}
          - {uf: PA, municipio: ORIXIMINA, produto: ETANOL, semana: 2024-01-29, cnpj: "8", preco_venda: 6.60}
    expect:
      rows:
        - {cnpj: "1", fora_da_curva: false}
        - {cnpj: "2", fora_da_curva: false}
        - {cnpj: "3", fora_da_curva: false}
        - {cnpj: "4", fora_da_curva: false}
        - {cnpj: "5", fora_da_curva: false}
        - {cnpj: "6", fora_da_curva: false}
        - {cnpj: "7", fora_da_curva: false}
        - {cnpj: "8", fora_da_curva: true}
